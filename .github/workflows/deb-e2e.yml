name: deb-e2e

# End-to-end test for the Debian/Ubuntu packaging path: build the .deb on
# every PR that touches packaging-relevant files, then `apt install` it in a
# matrix of containers and transcribe a recording with it (tests/smoke/).
# Catches regressions in build-deb.sh, nfpm configs, src/ changes, or a
# dependency release that breaks the bundled venv before they reach a user.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - "scripts/build-deb.sh"
      - "pyproject.toml"
      - "src/**"
      - "tests/smoke/**"
      - ".github/workflows/deb-e2e.yml"
  # Daily as well: the venv takes the newest dependencies when it is built, so a
  # dependency release can break it with no commit here. PyAV 19 did, a week
  # before 0.9.9 shipped with it.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.39.0
          curl -sSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build wheel
        run: uv build

      - name: Build .deb packages
        run: ./scripts/build-deb.sh dist/si_mic-*.whl

      - name: Inspect built .deb
        run: |
          echo "=== file sizes ==="
          ls -lh dist/*.deb
          echo ""
          echo "=== /usr/bin/simic wrapper ==="
          dpkg-deb -c dist/simic_*.deb | grep "usr/bin/simic"
          echo ""
          echo "=== venv/bin entries ==="
          dpkg-deb -c dist/simic_*.deb | grep "venv/bin/" | head -15
          echo ""
          echo "=== shebang of venv/bin/simic (extracted) ==="
          mkdir -p /tmp/inspect
          dpkg-deb -x dist/simic_*.deb /tmp/inspect
          head -1 /tmp/inspect/opt/simic/venv/bin/simic
          echo ""
          echo "=== venv python symlinks (extracted) ==="
          ls -la /tmp/inspect/opt/simic/venv/bin/python /tmp/inspect/opt/simic/venv/bin/python3 /tmp/inspect/opt/simic/venv/bin/python3.13
          echo ""
          echo "=== resolve symlink chain ==="
          readlink -f /tmp/inspect/opt/simic/venv/bin/python
          ls -la /tmp/inspect/opt/simic/python/bin/python3.13

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: simic-debs
          path: dist/*.deb
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:26.10
          - ubuntu:26.04
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:13
          - debian:12
    steps:
      # For tests/smoke/: the recording and the script that transcribes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download .deb artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: simic-debs
          path: dist

      - name: List .debs
        run: ls -la dist/

      - name: Smoke test on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist" -v "$PWD/tests/smoke:/smoke:ro" "${{ matrix.image }}" bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq /dist/simic_*.deb
              echo "=== /usr/bin/simic ==="
              ls -la /usr/bin/simic
              cat /usr/bin/simic
              echo ""
              echo "=== /opt/simic/venv/bin/simic ==="
              ls -la /opt/simic/venv/bin/simic || echo "MISSING"
              head -1 /opt/simic/venv/bin/simic 2>&1 || true
              echo ""
              echo "=== venv python symlinks ==="
              ls -la /opt/simic/venv/bin/python /opt/simic/venv/bin/python3 /opt/simic/venv/bin/python3.13 2>&1 || true
              echo ""
              echo "=== bundled python binary ==="
              ls -la /opt/simic/python/bin/python3.13 2>&1 || true
              /opt/simic/python/bin/python3.13 --version 2>&1 || true
              echo ""
              echo "=== running simic --version ==="
              simic --version
              echo "=== running simic status ==="
              simic status
              echo "=== transcribing tests/smoke/speech.wav ==="
              /smoke/transcribe.sh
              echo "=== the tray package and the icon ==="
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /dist/simic-tray_*.deb
              /smoke/desktop.sh /opt/simic/venv/bin/python
          '
