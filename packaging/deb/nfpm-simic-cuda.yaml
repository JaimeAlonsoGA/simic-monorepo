name: simic-cuda
arch: all
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: "Jaime Alonso <alonsog.jaime@gmail.com>"
description: |
  CUDA 12 cuBLAS/cuDNN runtime for GPU-accelerated transcription in simic.
  Meta-package: the CUDA 12 wheels (~700 MB) are pulled in by the post-install
  hook into /opt/simic/'s virtualenv. faster-whisper's ctranslate2 needs
  libcublas.so.12 / libcudnn.so.9, which are absent on CUDA 13 systems.
homepage: https://github.com/JaimeAlonsoGA/simic-monorepo
license: Apache-2.0

depends:
  - simic (= ${VERSION})

scripts:
  postinstall: ./packaging/deb/postinst/simic-cuda.sh
  preremove: ./packaging/deb/prerm/simic-cuda.sh
