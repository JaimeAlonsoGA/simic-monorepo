[project]
name = "si-mic"
version = "0.9.10"
description = "Super Intelligent Mic: record any meeting on Linux and get a Markdown transcript in Obsidian, transcribed locally"
readme = "README.md"
authors = [
    { name = "Jaime Alonso", email = "alonsog.jaime@gmail.com" },
    { name = "Yast", email = "yastcher@gmail.com" },
]
maintainers = [{ name = "Jaime Alonso", email = "alonsog.jaime@gmail.com" }]
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
keywords = ["meeting", "transcription", "whisper", "diarization", "obsidian", "pipewire"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "faster-whisper>=1.0.0,<2",
    # Not imported here: faster-whisper decodes audio with it. Its 1.2.1 passes
    # av.open(metadata_errors=...), which PyAV 19 removed, and asks only for av>=11.
    # Fixed in SYSTRAN/faster-whisper#1495, not released yet; lift the bound with the
    # faster-whisper release that carries it.
    "av>=11,<19",
    "pydantic-settings>=2.0.0,<3",
    # Comes with pydantic-settings; named because `simic ui` writes the .env with it.
    "python-dotenv>=1.0.0,<2",
    "click>=8.0.0,<9",
]

[project.optional-dependencies]
diarize = [
    "pyannote-audio>=3.1.0,<5",
    "torch>=2.0.0,<3",
    "torchaudio>=2.0.0,<3",
]
stt = [
    "openai>=1.50.0,<3",
]
llm = [
    "anthropic>=0.40.0,<1",
    "openai>=1.50.0,<3",
]
tray = [
    "dbus-next>=0.2.3,<1",
]

[project.scripts]
simic = "simic.cli:cli"

[project.urls]
Homepage = "https://github.com/JaimeAlonsoGA/simic-monorepo"
Repository = "https://github.com/JaimeAlonsoGA/simic-monorepo"
Issues = "https://github.com/JaimeAlonsoGA/simic-monorepo/issues"
Changelog = "https://github.com/JaimeAlonsoGA/simic-monorepo/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simic"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "ty>=0.0.1a7",
    "pyannote-audio>=3.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "dbus-next>=0.2.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".claude",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "G", "PLC", "PLR", "SIM", "S", "RUF"]
ignore = [
    "S603",    # subprocess calls are safe (list-based, no shell)
    "S607",    # partial executable paths (ffmpeg, parecord) are intentional
]
fixable = ["ALL"]

[tool.ruff.lint.pylint]
max-args = 6  # Settings + 5 domain args is a common shape in this codebase

[tool.ruff.lint.per-file-ignores]
# Tests: pytest idioms (bare assert, fake tokens, magic values in assertions).
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004"]
# Lazy imports to keep CLI startup (--help, status) free of ~10s ML model load
# (faster_whisper/torch are pulled in transitively from pipeline/live/tray).
"src/simic/cli.py" = ["PLC0415"]
# GTK and dbus-next are optional: imported only when `simic ui` / `tray` runs.
"src/simic/_cli_gui.py" = ["PLC0415"]
# pyannote.audio + torch are `[diarize]` extras — must import inside functions
# so users without the extra don't get ImportError on module load.
"src/simic/diarizer.py" = ["PLC0415"]
# anthropic/openai are `[llm]` extras — same lazy-import rationale as diarizer.
"src/simic/summarizer.py" = ["PLC0415"]
"src/simic/_stt_openai.py" = ["PLC0415"]
# D-Bus method/signal signatures live in string annotations (e.g. `-> "u(ia{sv}av)"`)
# that dbus-next reads at runtime. ruff F821/F722 cannot tell these strings apart
# from broken forward refs, so we silence them in the SNI/DBusMenu modules.
"src/simic/_sni.py" = ["F821", "F722"]
"src/simic/_dbusmenu.py" = ["F821", "F722"]

[tool.ruff.lint.isort]
known-local-folder = ["simic", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=simic --cov-report=term-missing"

[tool.coverage.run]
source = ["src/simic"]
# GUI modules, require a display — tested locally only. What they show and do lives in
# _activity.py and _config.py, which are covered.
omit = ["src/simic/tray.py", "src/simic/ui.py", "src/simic/_ui_settings.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]

[tool.ty.environment]
python-version = "3.13"
# Project root needed for `from tests.fixtures import ...`
# src/ needed for `from simic import ...`
extra-paths = [".", "src"]
